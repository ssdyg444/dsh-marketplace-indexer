name: build-registry

on:
  schedule:
    # 每 2 小时增量更新（UTC 偶数点，即北京时间每偶数点整）
    - cron: "0 */2 * * *"
    # 每天 04:00 UTC（北京时间 12:00）全量重建，刷新 star 数等静态数据
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全量重建索引（默认增量）"
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只允许一个构建，避免定时与手动触发重叠
concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: node --check scripts/build-registry.mjs

      - name: Build registry (full)
        # 每天 04:00 或手动勾选 full：全量重建
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *' }}
        run: node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build registry (incremental)
        # 其余每 2 小时：增量，只拉最近 3 天 pushed 的仓库并与旧索引合并
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *') }}
        run: INCREMENTAL_DAYS=3 node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit registry.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update registry.json"
          # 远端可能已被其他提交推进：先 rebase 再推，最多重试 3 次
          for i in 1 2 3; do
            if git pull --rebase -X ours origin main >/dev/null 2>&1 && git push origin main >/dev/null 2>&1; then
              echo "已提交更新"
              exit 0
            fi
            echo "推送被拒绝（第 $i 次），10 秒后重试..."
            sleep 10
          done
          echo "推送失败：多次重试后仍被拒绝" >&2
          exit 1